<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vibe-git</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗂</text></svg>">
<script nonce="/*BOOT_NONCE*/">/*BOOT*/</script>
</head>
<body>

<div class="app">
  <div class="progress" id="progress" hidden><i></i></div>

  <!-- GitHub Desktop's three-panel header: what repo, what branch, what sync state -->
  <div class="topbar">
    <button class="tb" id="tb-repo" aria-expanded="false" aria-haspopup="true">
      <span class="k">Current repository</span>
      <span class="v" id="tb-repo-v">—</span>
    </button>
    <button class="tb" id="tb-branch" aria-expanded="false" aria-haspopup="true">
      <span class="k">Current branch</span>
      <span class="v" id="tb-branch-v">—</span>
    </button>
    <button class="tb" id="tb-sync" aria-expanded="false" aria-haspopup="true">
      <span class="k" id="tb-sync-k">Fetch origin</span>
      <span class="v" id="tb-sync-v">—</span>
    </button>
    <div class="tb-right">
      <span class="dry" id="dry-badge" hidden>Dry run — no writes</span>
      <span class="remote" id="remote-badge" hidden></span>
      <span class="led" id="led" title="connection"></span>
      <span class="lab" id="stamp"></span>
      <button class="btn sm" id="btn-theme" title="Theme: following your system setting"
              aria-label="Theme">◐</button>
      <button class="btn sm" id="btn-refresh" title="Reload everything from git and GitHub">Refresh</button>
      <button class="btn sm" id="btn-ai" aria-expanded="false" aria-controls="ai-panel"
              title="Assistant — runs alongside whatever else you're doing">Assistant <span id="ai-pip"></span></button>
    </div>
  </div>

  <div class="main">
    <aside class="side">
      <!--
        Each entry says what QUESTION its view answers and, where it matters, which half of
        the app it belongs to. The split is the thing a one-word label cannot carry: Changes,
        Conflicts and History are local Git and act immediately; Issues, Plan, Pull requests
        and Staged are GitHub and act only when you push. Reading "Changes" and "Staged" as
        the same kind of pending is the mistake the labels invite.
      -->
      <nav class="nav" id="nav">
        <button data-view="issues"  aria-current="true"
                title="Every issue in the tracker, open and closed. Filter by state, milestone, label, assignee, or what is ready to start now. Editing anything here stages a change — nothing reaches GitHub until you push it.">Issues        <span class="count" id="c-issues">—</span></button>
        <button data-view="plan"    aria-current="false"
                title="What to work on next, and why: open issues ranked from milestone order, due dates, checklist progress and what blocks what. Generate one from the Assistant's Run tab — until then this is disabled.">Plan          <span class="count" id="c-plan">—</span></button>
        <button data-view="changes" aria-current="false"
                title="Uncommitted work in your working tree, file by file, with stashes and the commit box. This is local Git, not GitHub: committing here changes nothing on the remote until you push the branch.">Changes       <span class="count" id="c-changes">—</span></button>
        <!-- Only present while a merge is half-finished; renderNav() shows and hides it. -->
        <button data-view="conflicts" id="nav-conflicts" aria-current="false" hidden
                title="Appears only while a merge or rebase is half-finished. Names both sides of every conflict — which branch each came from and which is newer — and says so loudly when a rebase has swapped them.">Conflicts     <span class="count" id="c-conflicts">0</span></button>
        <button data-view="history" aria-current="false"
                title="Commits on the current branch, newest first. Click one to read its message and the full diff it introduced.">History       <span class="count" id="c-history">—</span></button>
        <button data-view="prs"     aria-current="false"
                title="Pull requests on this repository — open, merged or closed — and a form to raise a new one from the current branch with an editable description.">Pull requests <span class="count" id="c-prs">—</span></button>
        <button data-view="staged"  aria-current="false"
                title="Issue changes waiting to be pushed: edits, comments, closes, reopens and new issues. Review, alter or drop any of them here. This is the only place issue changes leave for GitHub.">Staged        <span class="count" id="c-staged">0</span></button>
      </nav>
      <div class="side-body" id="side-body"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <main class="pane" id="pane">
      <div class="empty">Starting up…</div>
    </main>

    <!-- Right rail. Model work is slow, so it lives beside the app rather than taking it over. -->
    <aside class="rail" id="ai-panel" hidden aria-label="Assistant">
      <div class="rail-head">
        <div class="rail-tabs" role="tablist">
          <!-- What each tab is FOR, not what it is called. The three do different kinds of
               work — batch jobs, conversation, configuration — and the one-word labels that
               fit the rail do not say which is which. -->
          <button id="ai-tab-run" role="tab" aria-selected="true"
                  title="One-shot jobs over the whole tracker: classify, suggest, plan, find duplicates. Everything they produce is a proposal you stage yourself.">Run</button>
          <button id="ai-tab-chat" role="tab" aria-selected="false"
                  title="Ask about this repository in your own words. It can read the issues, the plan, the commits and the source, and propose changes — it can never write to GitHub.">Chat</button>
          <button id="ai-tab-set" role="tab" aria-selected="false"
                  title="Which model, which endpoint, and how much of it to use. Keys are stored locally and never reach this page.">Settings</button>
        </div>
        <span class="rail-state" id="ai-state"></span>
        <button class="btn sm" id="ai-close" title="Collapse">✕</button>
      </div>
      <div class="rail-body" id="ai-body"></div>
      <div class="rail-foot" id="ai-foot"></div>
    </aside>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
